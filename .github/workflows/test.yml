name: Test

# Runs the repo's pytest suite on every pull request and on main (NIT-1103). A red suite fails the
# check; it is never skipped here. nitro-common is checked out at its default branch, the same ref
# deploy builds the image against, so tests run against what ships.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout utils-service
        uses: actions/checkout@v4
        with:
          path: utils-service

      - name: Checkout nitro-common
        uses: actions/checkout@v4
        with:
          repository: nitro-wagering/common
          path: common
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: utils-service/pyproject.toml

      - name: Install dependencies
        working-directory: utils-service
        run: |
          pip install -e ../common
          pip install -e ".[dev]"

      - name: Apply schema with Atlas
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test?sslmode=disable" \
            -e NITRO_MIGRATE_TEST_MODE=true \
            supakaity/nitro-migrate:latest

      - name: Run tests
        working-directory: utils-service
        env:
          TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
          PGUSER: "test"
          PGPASSWORD: "test"
        run: pytest -v
