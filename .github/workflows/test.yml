name: Test

# Runs the repo's pytest suite on every pull request and on main (NIT-1103). pull_request has no
# branch filter so stacked PRs run tests too. nitro-common is checked out at the commit pinned
# in COMMON_REF.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

env:
  # nitro-common is pinned; bump deliberately, in every workflow at once (tests/test_common_pin.py).
  COMMON_REF: 3a9f8f6574d9d00d16e4800b620655d3eed04b2f
  # tests/sql is copied from migrate at this commit (tests/test_migrate_sql_pin.py); bump it with the copy.
  MIGRATE_REF: af01e76657583083ae43a9aa86c91983bba1e342

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.9-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout utils-service
        uses: actions/checkout@v4
        with:
          path: utils-service

      - name: Checkout nitro-common
        uses: actions/checkout@v4
        with:
          repository: nitro-wagering/common
          ref: ${{ env.COMMON_REF }}
          path: common
          token: ${{ secrets.GH_PAT }}

      - name: Checkout migrate
        uses: actions/checkout@v4
        with:
          repository: nitro-wagering/migrate
          ref: ${{ env.MIGRATE_REF }}
          fetch-depth: 0
          path: migrate
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: utils-service/pyproject.toml

      - name: Install dependencies
        working-directory: utils-service
        run: |
          pip install -e ../common
          pip install -e ".[dev]"

      # Schema from the nitro-migrate main build 1ed7c6d (2026-11-05). Bump this digest in the
      # same PR as any schema.hcl change the tests depend on.
      - name: Apply schema with Atlas
        run: |
          docker run --rm \
            --network host \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test?sslmode=disable" \
            -e NITRO_MIGRATE_TEST_MODE=true \
            supakaity/nitro-migrate@sha256:322ef2a45e0e606e63107490263a4e718598e5f1f4ddfd38b886bfc7a47b2aed

      - name: Run tests
        working-directory: utils-service
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://test:test@localhost:5432/test"
          MIGRATE_PATH: ${{ github.workspace }}/migrate
        run: pytest -v
