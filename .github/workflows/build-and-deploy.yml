name: Build & Deploy

on:
  workflow_dispatch:

env:
  IMAGE: supakaity/nitro-utils

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout nitro-common
        uses: actions/checkout@v4
        with:
          repository: nitro-wagering/common
          path: common
          token: ${{ secrets.GH_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig

      - name: Deploy utils-service
        env:
          KUBECONFIG: /tmp/kubeconfig
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          sed -i "s|$IMAGE:latest|$IMAGE:$DEPLOY_SHA|" k8s/deployment.yaml
          grep "$DEPLOY_SHA" k8s/deployment.yaml || (echo "Image tag replacement failed" && exit 1)
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        env:
          KUBECONFIG: /tmp/kubeconfig
        run: kubectl rollout status deployment/nitro-utils -n nitro --timeout=180s

      - name: Cleanup kubeconfig
        if: always()
        run: rm -f /tmp/kubeconfig
