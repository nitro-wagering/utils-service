<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nitro Wagering — Utilities</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0b0d0e;
      --color-surface: #101416;
      --color-surface-hover: #141a1d;
      --color-border: #1a2023;
      --color-text: #e6eaec;
      --color-text-secondary: #c3ccd1;
      --color-text-tertiary: #6d7a80;
      --color-green: #4fc98a;

      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono: 'IBM Plex Mono', 'SF Mono', Consolas, Monaco, monospace;

      --radius-md: 8px;
      --radius-lg: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 15px;
      color: var(--color-text-secondary);
      margin-bottom: 40px;
    }

    .utils-grid {
      display: grid;
      gap: 16px;
    }

    .util-card {
      display: block;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px 28px;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
    }

    .util-card:hover {
      background: var(--color-surface-hover);
      border-color: var(--color-green);
      transform: translateY(-2px);
    }

    .util-card:active {
      transform: translateY(0);
    }

    .util-card h2 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--color-text);
    }

    .util-card p {
      font-size: 14px;
      color: var(--color-text-tertiary);
      line-height: 1.6;
    }

    .util-card .arrow {
      display: inline-block;
      margin-left: 8px;
      color: var(--color-green);
      transition: transform 0.15s ease;
    }

    .util-card:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 13px;
      font-family: var(--font-mono);
      color: var(--color-text-tertiary);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nitro Wagering</h1>
    <p class="subtitle">Utilities & Tools</p>

    <div class="utils-grid">
      <a href="/monitor" class="util-card">
        <h2>Race Day Monitor <span class="arrow">→</span></h2>
        <p>Live race-day watchlist with betting tracker, predictions, odds monitoring, and results display.</p>
      </a>
    </div>

    <footer>
      Nitro Wagering — 2026
    </footer>
  </div>
</body>
</html>
