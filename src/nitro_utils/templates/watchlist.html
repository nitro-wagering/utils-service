<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor — Nitro Wagering</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-race-group: #1c2128;
      --border: #30363d;
      --border-race: #484f58;
      --text-primary: #c9d1d9;
      --text-secondary: #8b949e;
      --text-tertiary: #6e7681;
      --accent: #58a6ff;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --value: #3fb950;
      --overpriced: #f85149;
      --mono: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', 'Droid Sans Mono', 'Source Code Pro', monospace;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    .container {
      max-width: 100%;
      padding: 1.5rem;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .header__title h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .header__title p {
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-secondary);
      border-color: var(--text-tertiary);
    }

    .btn:active {
      background: var(--bg-primary);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .banner {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }

    .banner--success {
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .banner--error {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }

    thead {
      background: var(--bg-tertiary);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    th {
      padding: 0.625rem 0.5rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      font-size: 0.6875rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    th:hover {
      background: var(--bg-secondary);
    }

    th.sticky-col {
      position: sticky;
      background: var(--bg-tertiary);
      z-index: 11;
    }

    th.sticky-col-1 {
      left: 0;
      min-width: 80px;
    }

    th.sticky-col-2 {
      left: 80px;
      min-width: 120px;
    }

    th.sticky-col-3 {
      left: 200px;
      min-width: 60px;
    }

    th.sticky-col-4 {
      left: 260px;
      min-width: 80px;
    }

    th .sort-arrow {
      position: absolute;
      right: 0.25rem;
      font-size: 0.625rem;
      opacity: 0.5;
    }

    th.sorted .sort-arrow {
      opacity: 1;
      color: var(--accent);
    }

    td {
      padding: 0.625rem 0.5rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    td.sticky-col {
      position: sticky;
      background: var(--bg-secondary);
      z-index: 1;
    }

    td.sticky-col-1 {
      left: 0;
      min-width: 80px;
    }

    td.sticky-col-2 {
      left: 80px;
      min-width: 120px;
    }

    td.sticky-col-3 {
      left: 200px;
      min-width: 60px;
    }

    td.sticky-col-4 {
      left: 260px;
      min-width: 80px;
    }

    tbody tr:hover td {
      background: rgba(88, 166, 255, 0.05);
    }

    tbody tr:hover td.sticky-col {
      background: rgba(88, 166, 255, 0.08);
    }

    .race-header td {
      background: var(--bg-race-group);
      border-top: 2px solid var(--border-race);
      border-bottom: 1px solid var(--border-race);
      padding: 0.5rem;
      font-weight: 600;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .race-header:first-child td {
      border-top: none;
    }

    .mono {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
    }

    .text-right {
      text-align: right;
    }

    .text-center {
      text-align: center;
    }

    .text-muted {
      color: var(--text-secondary);
    }

    .badge {
      display: inline-block;
      padding: 0.1875rem 0.4375rem;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .badge--won {
      background: rgba(63, 185, 80, 0.25);
      color: #2ea043;
    }

    .badge--lost {
      background: rgba(248, 81, 73, 0.25);
      color: #da3633;
    }

    .badge--pending {
      background: rgba(210, 153, 34, 0.25);
      color: #bf8700;
    }

    .badge--monitor-win {
      background: rgba(63, 185, 80, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
    }

    .badge--monitor-place {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
    }

    .overlay-value {
      color: var(--value);
      font-weight: 500;
    }

    .overlay-overpriced {
      color: var(--overpriced);
      font-weight: 500;
    }

    .col-primary {
      font-weight: 500;
      color: var(--text-primary);
    }

    .col-secondary {
      color: var(--text-tertiary);
      font-size: 0.75rem;
    }

    .row-value {
      border-left: 3px solid var(--value);
    }

    .row-overpriced {
      border-left: 3px solid var(--overpriced);
    }

    .row-value:hover td {
      background: rgba(63, 185, 80, 0.08);
    }

    .row-value:hover td.sticky-col {
      background: rgba(63, 185, 80, 0.1);
    }

    .row-overpriced:hover td {
      background: rgba(248, 81, 73, 0.05);
    }

    .row-overpriced:hover td.sticky-col {
      background: rgba(248, 81, 73, 0.07);
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-secondary);
    }

    .error-state {
      text-align: center;
      padding: 3rem;
      color: var(--error);
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .header {
        flex-direction: column;
        align-items: stretch;
      }

      .controls {
        width: 100%;
      }

      .btn {
        flex: 1;
      }

      th, td {
        padding: 0.5rem 0.25rem;
        font-size: 0.6875rem;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div class="header__title">
        <h1>Monitor</h1>
        <p id="generated-at">Loading...</p>
      </div>
      <div class="controls">
        <button id="refresh-btn" class="btn">Refresh</button>
        <button id="download-btn" class="btn">Download</button>
      </div>
    </header>

    <div id="banner-container"></div>

    <div id="content">
      <div class="loading">Loading watchlist...</div>
    </div>
  </main>

  <script>
    const API_BASE = '/api';
    const POLL_INTERVAL = 30000;

    let pollTimeout = null;
    let currentData = null;
    let sortColumn = null;
    let sortAsc = true;

    async function fetchWatchlist() {
      const res = await fetch(`${API_BASE}/watchlist`, { credentials: 'include' });
      if (!res.ok) throw new Error(`GET /watchlist failed: ${res.status}`);
      return res.json();
    }

    async function downloadWatchlist() {
      const res = await fetch(`${API_BASE}/watchlist/download`, { credentials: 'include' });
      if (!res.ok) throw new Error(`GET /download failed: ${res.status}`);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `watchlist-${new Date().toISOString().split('T')[0]}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function showBanner(message, type) {
      const container = document.getElementById('banner-container');
      const banner = document.createElement('div');
      banner.className = `banner banner--${type}`;
      banner.textContent = message;
      container.innerHTML = '';
      container.appendChild(banner);
      setTimeout(() => banner.remove(), 5000);
    }

    function formatPrice(value) {
      if (value === null || value === undefined) return '—';
      if (value >= 999) return '—';
      return value.toFixed(2);
    }

    function formatPercent(value) {
      if (value === null || value === undefined) return '—';
      return `${value.toFixed(1)}%`;
    }

    function formatOverlay(value) {
      if (value === null || value === undefined) return '—';
      const formatted = `${value > 0 ? '+' : ''}${value.toFixed(1)}%`;
      if (value > 0) return `<span class="overlay-value">${formatted}</span>`;
      if (value < 0) return `<span class="overlay-overpriced">${formatted}</span>`;
      return formatted;
    }

    function formatPlacedBadge(placed) {
      if (!placed) return '—';
      if (placed === 'WON') return '<span class="badge badge--won">Won</span>';
      if (placed === 'LOST') return '<span class="badge badge--lost">Lost</span>';
      if (placed === 'PENDING') return '<span class="badge badge--pending">Pending</span>';
      return placed;
    }

    function formatMonitorNetBadge(value) {
      if (!value) return '—';
      if (value === 'WIN') return '<span class="badge badge--monitor-win">Win</span>';
      if (value === 'PLACE') return '<span class="badge badge--monitor-place">Place</span>';
      return value;
    }

    function sortEntries(entries, column, asc) {
      const sorted = [...entries].sort((a, b) => {
        let aVal = a[column];
        let bVal = b[column];

        if (aVal === null || aVal === undefined) return 1;
        if (bVal === null || bVal === undefined) return -1;

        if (typeof aVal === 'string') {
          return asc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
        }

        return asc ? aVal - bVal : bVal - aVal;
      });
      return sorted;
    }

    function renderTable(data) {
      const { entries } = data;

      let displayEntries = entries;
      if (sortColumn) {
        displayEntries = sortEntries(entries, sortColumn, sortAsc);
      }

      const groupedByRace = {};
      displayEntries.forEach(entry => {
        const key = `${entry.track}_${entry.race_number}_${entry.race_time}`;
        if (!groupedByRace[key]) {
          groupedByRace[key] = {
            track: entry.track,
            race_number: entry.race_number,
            race_time: entry.race_time,
            entries: []
          };
        }
        groupedByRace[key].entries.push(entry);
      });

      const html = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th class="sticky-col sticky-col-1" data-sort="track" title="Track">Track</th>
                <th class="sticky-col sticky-col-2" data-sort="horse" title="Horse">Horse</th>
                <th class="sticky-col sticky-col-3 text-right" data-sort="win_pct" title="Win Probability %">Win %</th>
                <th class="sticky-col sticky-col-4 text-right" data-sort="win_overlay_pct" title="Win Overlay %">W Ovly</th>
                <th class="text-center" data-sort="in_monitor_net" title="In Monitor Net">Net</th>
                <th class="text-right" data-sort="win_trigger" title="Win Trigger Price">W Trig</th>
                <th class="text-right" data-sort="class_rank" title="Class Rank">Cls Rnk</th>
                <th class="text-center" data-sort="placed" title="Result Status">Result</th>
                <th class="text-right" data-sort="our_win" title="Our Win Price">Our Win</th>
                <th class="text-right" data-sort="place_pct" title="Place Probability %">Pl %</th>
                <th class="text-right" data-sort="place_trigger" title="Place Trigger Price">Pl Trig</th>
                <th class="text-right" data-sort="our_place" title="Our Place Price">Our Pl</th>
                <th class="text-right" data-sort="place_overlay_pct" title="Place Overlay %">Pl Ovly</th>
                <th class="text-right" data-sort="market_win" title="Market Win Price">Mkt W</th>
                <th class="text-right" data-sort="market_place" title="Market Place Price">Mkt Pl</th>
                <th class="text-right" data-sort="market_rank" title="Market Rank">Mkt Rnk</th>
                <th class="text-right" data-sort="neds_win" title="Neds Win Price">Neds W</th>
                <th class="text-right" data-sort="neds_place" title="Neds Place Price">Neds Pl</th>
                <th class="text-right" data-sort="win_distance_to_trigger" title="Win Distance to Trigger $">W Dist</th>
                <th class="text-right" data-sort="place_distance_to_trigger" title="Place Distance to Trigger $">Pl Dist</th>
                <th class="text-right" data-sort="ml_win_pct" title="ML Win Probability %">ML W%</th>
                <th class="text-right" data-sort="ml_place_pct" title="ML Place Probability %">ML Pl%</th>
                <th class="text-right" data-sort="ml_win_rank" title="ML Win Rank">ML W Rnk</th>
                <th class="text-right" data-sort="pf_time_rank" title="PuntingForm Time Rank">PF T Rnk</th>
                <th class="text-right" data-sort="sim_order" title="Simulation Order">Sim Ord</th>
                <th class="text-right" data-sort="sim_win_rank" title="Simulation Win Rank">Sim W Rnk</th>
              </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
          </table>
        </div>
      `;

      document.getElementById('content').innerHTML = html;
      const tbody = document.getElementById('table-body');

      Object.values(groupedByRace).forEach(race => {
        const raceHeader = document.createElement('tr');
        raceHeader.className = 'race-header';
        raceHeader.innerHTML = `<td colspan="26">${race.track} R${race.race_number} • ${race.time}</td>`;
        tbody.appendChild(raceHeader);

        race.entries.forEach((entry) => {
          const row = document.createElement('tr');
          let rowClasses = [];

          if (entry.win_overlay_pct !== null && entry.win_overlay_pct !== undefined) {
            if (entry.win_overlay_pct > 0) {
              rowClasses.push('row-value');
            } else if (entry.win_overlay_pct < 0) {
              rowClasses.push('row-overpriced');
            }
          }

          if (rowClasses.length > 0) {
            row.className = rowClasses.join(' ');
          }

          row.innerHTML = `
            <td class="sticky-col sticky-col-1">${entry.track}</td>
            <td class="sticky-col sticky-col-2">${entry.horse}</td>
            <td class="sticky-col sticky-col-3 text-right mono col-primary">${formatPercent(entry.win_pct)}</td>
            <td class="sticky-col sticky-col-4 text-right mono col-primary">${formatOverlay(entry.win_overlay_pct)}</td>
            <td class="text-center col-primary">${formatMonitorNetBadge(entry.in_monitor_net)}</td>
            <td class="text-right mono col-primary">${formatPrice(entry.win_trigger)}</td>
            <td class="text-right mono col-primary">${entry.class_rank || '—'}</td>
            <td class="text-center col-primary">${formatPlacedBadge(entry.placed)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.our_win)}</td>
            <td class="text-right mono col-secondary">${formatPercent(entry.place_pct)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.place_trigger)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.our_place)}</td>
            <td class="text-right mono col-secondary">${formatOverlay(entry.place_overlay_pct)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.market_win)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.market_place)}</td>
            <td class="text-right mono col-secondary">${entry.market_rank || '—'}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.neds_win)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.neds_place)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.win_distance_to_trigger)}</td>
            <td class="text-right mono col-secondary">${formatPrice(entry.place_distance_to_trigger)}</td>
            <td class="text-right mono col-secondary">${formatPercent(entry.ml_win_pct)}</td>
            <td class="text-right mono col-secondary">${formatPercent(entry.ml_place_pct)}</td>
            <td class="text-right mono col-secondary">${entry.ml_win_rank || '—'}</td>
            <td class="text-right mono col-secondary">${entry.pf_time_rank || '—'}</td>
            <td class="text-right mono col-secondary">${entry.sim_order || '—'}</td>
            <td class="text-right mono col-secondary">${entry.sim_win_rank || '—'}</td>
          `;

          tbody.appendChild(row);
        });
      });

      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const column = th.dataset.sort;
          if (sortColumn === column) {
            sortAsc = !sortAsc;
          } else {
            sortColumn = column;
            sortAsc = true;
          }

          document.querySelectorAll('th[data-sort]').forEach(t => {
            t.classList.remove('sorted');
            const arrow = t.querySelector('.sort-arrow');
            if (arrow) arrow.remove();
          });

          th.classList.add('sorted');
          const arrow = document.createElement('span');
          arrow.className = 'sort-arrow';
          arrow.textContent = sortAsc ? '▲' : '▼';
          th.appendChild(arrow);

          renderTable(currentData);
        });
      });
    }

    async function loadWatchlist() {
      try {
        const data = await fetchWatchlist();
        currentData = data;

        const generatedAt = new Date(data.generated_at).toLocaleString();
        document.getElementById('generated-at').textContent = `${data.entry_count} entries • Generated ${generatedAt}`;

        renderTable(data);

        if (pollTimeout) clearTimeout(pollTimeout);
        pollTimeout = setTimeout(loadWatchlist, POLL_INTERVAL);
      } catch (err) {
        document.getElementById('content').innerHTML = `<div class="error-state">${err.message}</div>`;
        if (pollTimeout) clearTimeout(pollTimeout);
        pollTimeout = setTimeout(loadWatchlist, POLL_INTERVAL);
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', async () => {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Refreshing...';
      try {
        await loadWatchlist();
        showBanner('Watchlist refreshed', 'success');
      } catch (err) {
        showBanner(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Refresh';
      }
    });

    document.getElementById('download-btn').addEventListener('click', async () => {
      try {
        await downloadWatchlist();
      } catch (err) {
        showBanner(err.message, 'error');
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
