apiVersion: apps/v1
kind: Deployment
metadata:
  name: nitro-utils
  namespace: nitro
  labels:
    app: nitro-utils
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nitro-utils
  template:
    metadata:
      labels:
        app: nitro-utils
    spec:
      serviceAccountName: nitro-utils
      securityContext:
        fsGroup: 0  # Allow read from hostPath ledger (owned by root)
      containers:
      - name: utils
        image: supakaity/nitro-utils:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - secretRef:
            name: nitro-shared-env
        env:
        - name: NITRO_AUTH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nitro-tracks-env
              key: NITRO_AUTH_PASSWORD
        - name: NITRO_AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nitro-tracks-env
              key: NITRO_AUTH_SECRET_KEY
        - name: NITRO_AUTH_COOKIE_SECURE
          value: "true"
        - name: NITRO_LOG_LEVEL
          value: "INFO"
        - name: NITRO_K8S_NAMESPACE
          value: "nitro"
        - name: NITRO_K8S_JOB_IMAGE
          value: "gcr.io/nitro-wagering/paper-monitor:latest"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: paper-monitor-ledger
          mountPath: /ledger
          readOnly: true
      volumes:
      - name: paper-monitor-ledger
        hostPath:
          path: /mnt/data/paper-monitor-ledger
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nitro-utils
  namespace: nitro
  labels:
    app: nitro-utils
spec:
  selector:
    app: nitro-utils
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nitro-utils
  namespace: nitro
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nitro-utils-job-creator
  namespace: nitro
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nitro-utils-job-creator
  namespace: nitro
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nitro-utils-job-creator
subjects:
- kind: ServiceAccount
  name: nitro-utils
  namespace: nitro
